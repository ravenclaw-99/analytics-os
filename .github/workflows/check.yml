name: check knowledge base
on: [push, pull_request]
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python3 tools/kb.py check examples/lumen
      - name: run deterministic system checks on the example
        working-directory: examples/lumen
        run: |
          CATALOG=system/fixtures/catalog.json system/jobs/run.sh schema-integrity
          system/jobs/run.sh semantic-integrity
          system/jobs/run.sh cohesion-redundancy
      - name: runtime smoke test (dry run, nothing is posted)
        working-directory: examples/lumen
        run: |
          python3 ../../tools/runtime/cli.py notify . --to slack
          python3 ../../tools/runtime/cli.py findings .
          python3 ../../tools/runtime/cli.py stats .
          python3 ../../tools/runtime/cli.py autonomy .
